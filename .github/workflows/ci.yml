name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (api + worker + test tooling)
        run: |
          pip install -r api/requirements.txt -r worker/requirements.txt
          pip install pytest ruff
      - name: Lint (pyflakes-class findings only — unused imports, undefined names)
        run: ruff check --select F .
      - name: Test (offline suites: no DB, no redis, no network)
        run: pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Type-check and build
        run: |
          npm ci
          npm run build
