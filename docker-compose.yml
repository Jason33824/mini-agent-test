services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://mini:minipw@postgres:5432/miniagent
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # the api image is python:3.12-slim (no curl) and the real route is
      # /healthz — probe it with stdlib urllib instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mini:minipw@postgres:5432/miniagent
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # agents/llm.py reads this name; the old OPENAI_BASE_URL entry was dead
      # (nothing in the repo consumes it) and silently fell back to api.openai.com
      MINI_AGENT_LLM_BASE_URL: ${MINI_AGENT_LLM_BASE_URL}
      PHOENIX_URL: http://phoenix:6006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      phoenix:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    # Task ledger DDL: applied automatically by the postgres image on first
    # volume init (docker-entrypoint-initdb.d). See postgres/init.sql.
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: mini
      POSTGRES_PASSWORD: minipw
      POSTGRES_DB: miniagent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini"]
      interval: 5s
      timeout: 3s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    depends_on:
      - phoenix-pg

  phoenix-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: phoenix
      POSTGRES_DB: phoenix
    volumes:
      - phoenix_pgdata:/var/lib/postgresql/data

  # Next.js frontend lands late in W1; excluded from default `up` until it builds.
  web:
    build: ./web
    profiles: ["full"]
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  phoenix_pgdata:
