server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # The api is addressed same-origin (no CORS); nginx is the router.
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # SSE: nginx buffers responses by default, which would batch the
        # event stream into blocks and kill its liveness. Stream it through.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # the health indicator in the top bar probes /healthz (the api's real
    # liveness route) — without this it 404s through the SPA fallback and
    # the badge shows red against a perfectly healthy api
    location = /healthz {
        proxy_pass http://api:8000;
    }

    # SPA fallback: deep links (/tasks/:id) and hard refreshes serve the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
